<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Mój Pomnik w Cesium</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
  </style>
</head>
<body>

  <div id="cesiumContainer"></div>

  <script>
    
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI1ZjA5MzQ4Ni03MWJhLTQzMWQtYTNmNy1lZTYzMDZlYmM5MTEiLCJpZCI6NDM1ODc1LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3Nzk2NDgzNzF9.boLBvFVeDG-f5hDXWlkFNp0h6vK75GeO1S1qljLpGnU';

    
    const viewer = new Cesium.Viewer('cesiumContainer', {
    shadows: true,
    terrainShadows: Cesium.ShadowMode.ENABLED,
    baseLayerPicker: false
    });

    viewer.imageryLayers.removeAll();

    
    viewer.clock.currentTime = Cesium.JulianDate.fromIso8601("2026-05-24T14:00:00Z");

    async function loadGoogle3DTiles() {
        try {
            const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(2275207); 
            viewer.scene.primitives.add(tileset);
        } catch (error) {
            console.error("Błąd ładowania budynków Google 3D:", error);
        }
    }
    loadGoogle3DTiles();


    const longitude = 18.538774; 
    const latitude = 54.483220;  
    const height = 60.7; 

    const position = Cesium.Cartesian3.fromDegrees(longitude, latitude, height);


    const heading = Cesium.Math.toRadians(-90); 
    const pitch = 0;
    const roll = 0;
    const hpr = new Cesium.HeadingPitchRoll(heading, pitch, roll);
    const orientation = Cesium.Transforms.headingPitchRollQuaternion(position, hpr);


    const entity = viewer.entities.add({
    name: 'Syrenka Plac Górnośląski',
    position: position,
    orientation: orientation,
    model: {
        uri: 'pomnik.glb', 
        scale: 0.5, 
        minimumPixelSize: 0,
        maximumScale: 1,
        shadows: Cesium.ShadowMode.ENABLED 
    }
    });

    viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(
            18.538715,        
            54.483329, 
            65.0       
        ),
        orientation: {
            heading: Cesium.Math.toRadians(160),   
            pitch: Cesium.Math.toRadians(-25),  
            roll: 0.0
        }
    });
  </script>
</body>
</html>
